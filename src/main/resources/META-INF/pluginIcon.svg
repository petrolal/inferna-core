<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d0b11"/>
      <stop offset="70%" stop-color="#140608"/>
      <stop offset="100%" stop-color="#0a0405"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="80" height="80" rx="16" fill="url(#bg)" stroke="#b81424" stroke-width="1.5"/>
  <circle cx="40" cy="38" r="28" fill="none" stroke="#e6192e" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  <!-- Pentagram cybernetic center -->
  <polygon points="40,24 44,36 56,36 46,43 50,54 40,47 30,54 34,43 24,36 36,36" 
           fill="none" stroke="#ff334b" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="40" cy="38" r="16" fill="none" stroke="#ff8533" stroke-width="1" opacity="0.7"/>
  <!-- Skull base glyph -->
  <path d="M33 55 C33 51, 47 51, 47 55 L46 62 C46 64, 44 65, 43 65 L37 65 C36 65, 34 64, 34 62 Z" fill="#e6d5d5" opacity="0.9"/>
  <circle cx="36" cy="56" r="1.5" fill="#0a0405"/>
  <circle cx="44" cy="56" r="1.5" fill="#0a0405"/>
  <line x1="38" y1="62" x2="38" y2="65" stroke="#0a0405" stroke-width="1"/>
  <line x1="42" y1="62" x2="42" y2="65" stroke="#0a0405" stroke-width="1"/>
  <!-- Biopunk horns -->
  <path d="M28 26 C24 20, 20 22, 18 16 C23 16, 28 20, 31 24" fill="none" stroke="#e6192e" stroke-width="2" stroke-linecap="round"/>
  <path d="M52 26 C56 20, 60 22, 62 16 C57 16, 52 20, 49 24" fill="none" stroke="#e6192e" stroke-width="2" stroke-linecap="round"/>
</svg>