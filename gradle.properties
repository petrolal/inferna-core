# Kotlin & JVM
kotlin.version=2.2.20
kotlin.stdlib.default.dependency=false
java.version=21

# IntelliJ Platform SDK
platformVersion=2025.3
platformPluginVersion=2.19.0

# Optional language-engine modules (:modules:scala, :modules:groovy).
# Pin scalaPluginVersion to a Marketplace release that targets `platformVersion` above;
# bump both together. See https://plugins.jetbrains.com/plugin/1347-scala/versions for the matrix.
scalaPluginVersion=2025.3.30

# JVM Memory and Optimization for Platform SDK Builds
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true


