# Kotlin & JVM
kotlin.version=2.2.20
java.version=21

# IntelliJ Platform SDK
# Kept in sync with the local Nix-provided IDE (2025.3.4 / build 253.x) that build.gradle.kts
# actually compiles and tests against via localIdeDir. This must match sinceBuild/untilBuild
# in build.gradle.kts and appInfoBuildNumber below - otherwise the plugin's declared
# compatibility range includes platform versions it was never actually built or run against.
platformVersion=2025.3
platformPluginVersion=2.2.1

# JVM Memory and Optimization for Platform SDK Builds
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Branding overrides baked into ApplicationInfo.xml by the prepareBranding task.
# Single source of truth so a platform/plugin version bump only needs updating here.
appInfoBuildNumber=IC-253.32098.37
appInfoMajorVersion=2025
appInfoMinorVersion=3.4
appInfoMajorReleaseDate=20251208
