name: Publish to JetBrains Marketplace

on:
  release:
    types: [published] # Manual fallback: publishing a Release by hand in the GitHub UI
  workflow_dispatch:    # Manual fallback: trigger from the GitHub UI with no Release involved
  workflow_call:        # Primary path: called directly by release.yml after it tags a release.
                         # Must be a direct call, not the `release: published` event above — a
                         # Release created with the default GITHUB_TOKEN (as release.yml does)
                         # does not fire other workflows' `release` triggers, by GitHub Actions
                         # design (loop prevention), so that event alone would never reach here.
    inputs:
      ref:
        description: >
          Git ref to build and publish. release.yml passes the tag it just created, since
          without this the checkout below would otherwise resolve to the commit that triggered
          release.yml's push event — i.e. the one *before* its version-bump commit and tag.
        required: false
        type: string

jobs:
  publish:
    name: Build, Sign & Publish Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check release tag matches plugin version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          gradleVersion="$(./gradlew -q printVersion)"
          if [ "$tag" != "$gradleVersion" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' (-> '$tag') does not match build.gradle.kts version '$gradleVersion'. Bump the version before tagging a release."
            exit 1
          fi

      - name: Run Tests
        run: ./gradlew test

      - name: Verify Plugin Structure
        run: ./gradlew verifyPluginStructure

      - name: Sign & Publish Plugin
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin
